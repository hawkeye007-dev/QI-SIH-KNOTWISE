[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knotwise"
version = "0.1.0"
description = "Quantum-inspired fuel prediction and green fleet optimization under regulatory uncertainty (SIH26138)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "deap>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"knotwise.regulatory" = ["*.json"]
"knotwise.fleet" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
